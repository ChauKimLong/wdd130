<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>
    <link rel="stylesheet" href="styles/quizz.css">
</head>

<body>
    <h1>✅ Basic HTML and CSS Quiz</h1>
    <div></div>
    <form>
        <p><b>1. </b>What does the acronym CSS stand for?</p>
        <input type="text">
        <p><b>2. </b>How are id and class attributes selected in CSS?</p>
        <textarea></textarea>
        <p><b>3. </b>Which of the following is a valid CSS comment?</p>
        <select name="css-quiz" id="css-quiz">
            <option>Choose One ...</option>
            <option value="# abcdef"># abcdef</option>
            <option value="/* abcdef */">/* abcdef */</option>
            <option value="/ abcdef /">/ abcdef /</option>
            <option value="! abcdef">! abcdef </option>
        </select>
        <p><b>4. </b>What is the bottom margin given this declaration?</p>

        <br><br>
        <button type="submit" value="Submit">Submit Quiz</button>
    </form>
    <div></div>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Wolf Rafting</title>
    <meta name="description" content="The general information how to contact White Wolf Rafting Site">
    <meta name="author" content="Long Kim Chau">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!----------------------------------------------------HEADER---------------------------------------------------------->
    <header>
        <img src="images/logo-of-webpage.webp" alt="logo of the website">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>


    <!-------------------------------------------------------MAIN---------------------------------------------------------->
    <main>
        <div class="contact-us-information">
            <h1>White Wolf Rafting</h1>
            <span>109-829 10th Street</span><br>
            <span>Canmore, AB T1W 0C3</span><br>
            <span>+1 403-675-0632</span><br>
            <span>info@whitewolfrafting.com</span><br>
        </div>
        <div class="contact-us-main-part">
            <div id="contact-us-main-part-left">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2505.9858851972035!2d-115.362697!3d51.090267999999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5370c57df3fbb7e3%3A0xd516a34d1226de8e!2sWhite%20Wolf%20Rafting!5e0!3m2!1sen!2s!4v1780492622899!5m2!1sen!2s"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div id="contact-us-main-part-right">
                <form>
                    <label for="user-name">Name: </label><input type="text" placeholder="Your name" id="user-name" name="user-name"><br><br>
                    <label for="user-email">Email: </label><input type="text" placeholder="Your email" id="user-email" name="user-email"><br><br>
                    <label>Message Purpose: </label><br>
                    <input type="radio" name="message-purpose" value="general inquiry" id="general-inquiry" checked><label for="general-inquiry">General Inquiry</label><br>
                    <input type="radio" name="message-purpose" value="reservation question" id="reservation-question"><label for="reservation-question">Reservation Question</label><br>
                    <input type="radio" name="message-purpose" value="website suggestion" id="website-suggestion"><label for="website-suggestion">Website Suggestion</label><br>
                    <br>
                    <label for="user-message">Message:</label><br>
                    <textarea id="user-message" name="user-email" placeholder="Type here"></textarea><br>
                    <br>
                    <input type="checkbox" value="subscribe" id="subscribe-checkbox" name="user-subscribe" checked>
                    <label for="subscribe-checkbox">Please Subscribe me to the monthyly newsletter</label><br>
                    <br>
                    <button type="submit" value="Submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <section class="contact-us-staffs">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/staff-jereme.webp" alt="picture of Jereme">
                <figcaption>Jereme</figcaption>
            </figure>
            <figure>
                <img src="images/staff-caitlyn.webp" alt="picture of Caitlyn">
                <figcaption>Caitlyn</figcaption>
            </figure>
            <figure>
                <img src="images/staff-jodi.webp" alt="picture of Jodi">
                <figcaption>Jodi</figcaption>
            </figure>
        </section>
    </main>


    <!-------------------------------------------------------FOOTER---------------------------------------------------------->
    <footer>
        <p>© 2026 | White Wolf Rafting | Long Kim Chau</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/whitewolfrafting/">
                <img src="images/icon-facebook.webp" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com/in/long-chau-08bb583a4/">
                <img src="images/icon-linkedin.webp" alt="LinkedIn Icon">
            </a>
            <a href="https://www.instagram.com/whitewolfrafting/">
                <img src="images/icon-instagram.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>

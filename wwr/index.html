<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | White Wolf Rafting</title>
    <meta name="description" content="The homepage of the White Wolf Rafting Site">
    <meta name="author" content="Long Kim Chau">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!----------------------------------------------------HEADER---------------------------------------------------------->
    <header>
        <img src="images/logo.png" alt="logo of the website">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>


    <!-------------------------------------------------------MAIN---------------------------------------------------------->
    <main id="main-homepage">
        <div class="hero">
            <div class="wide-image-box">
                <img id="homepage-background-image" src="images/homepage-background.webp" alt="background picture of the homepage">
                <h1>White Wolf Rafting</h1>
            </div>
            <article id="main-homepage-article">
                    <h2>Make Memories with us</h2>
                    <br>
                    <a href="trips.html">Book Now</a>
            </article>
        </div>


        <section class="main-homepage-section-1">
            <div></div>
            <figure>
                <img src="images/river-image.webp" alt="picture of rivers">
                <figcaption>River</figcaption>
                <p>Enjoy peaceful river views and exciting outdoor experiences with our guides.</p>
            </figure>
            <figure>
                <img src="images/camping-image.webp" alt="picture of campings">
                <figcaption>Camping</figcaption>
                <p>Relax by the riverside, enjoy the fresh air, and spend a peaceful night camping under the stars.</p>
            </figure>
            <figure>
                <img src="images/rapids-image.webp" alt="picture of rapids">
                <figcaption>Rapids</figcaption>
                <p>Feel the excitement of fast-moving rapids as our guides help you enjoy a safe and unforgettable rafting adventure.</p>
            </figure>
            <div></div>
        </section>


        <section class="main-homepage-section-2">
            <img src="images/waterfall-image.webp" alt="picture of waterfall">
            <form>
                <h2>More Than Just The Thrill</h2>
                <br>
                <label for="user-name">Name: </label><input type="text" placeholder="Your name" id="user-name" name="user-name"><br><br>
                <label for="user-email">Email: </label><input type="text" placeholder="Your email" id="user-email" name="user-email"><br><br>
                <br>
                <button type="submit" value="Submit">Sign up with us</button>
            </form>
        </section>
    </main>


    <!-------------------------------------------------------FOOTER---------------------------------------------------------->
    <footer>
        <p>© 2026 | White Wolf Rafting | Long Kim Chau</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/whitewolfrafting/">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com/in/long-chau-08bb583a4/">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://www.instagram.com/whitewolfrafting/">
                <img src="images/instagram-logo.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>

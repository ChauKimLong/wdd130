<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | White Wolf Rafting</title>
    <meta name="description" content="The homepage of the White Wolf Rafting Site">
    <meta name="author" content="Long Kim Chau">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!----------------------------------------------------HEADER---------------------------------------------------------->
    <header>
        <img src="images/logo.png" alt="logo of the website">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>


    <!-------------------------------------------------------MAIN---------------------------------------------------------->
    <main id="main-homepage">
        <div class="hero">
            <div class="wide-image-box">
                <img id="homepage-background-image" src="https://res.cloudinary.com/simpleview/image/upload/v1724965417/clients/bigskymt/fieldandforest_visitbigsky_rafting_M02_medium_bb8e8c7c-b18b-4e7f-9a8e-dd7ed8b440ee.jpg" alt="background picture of this introduction">
                <h1>White Wolf Rafting</h1>
            </div>
            <article id="main-homepage-article">
                    <h2>Make Memories with us</h2>
                    <br>
                    <a href="trips.html"><button>Book Now</button></a>
            </article>
        </div>


        <section class="main-homepage-section-1">
            <div></div>
            <figure>
                <img src="https://www.shutterstock.com/image-photo/waterfall-on-mountain-river-blue-600nw-1260317215.jpg" alt="picture of rivers">
                <figcaption>River</figcaption>
            </figure>
            <figure>
                <img src="https://www.shutterstock.com/image-photo/fisherman-on-bank-foggy-river-600nw-2244837523.jpg" alt="picture of campings">
                <figcaption>Camping</figcaption>
            </figure>
            <figure>
                <img src="https://www.shutterstock.com/image-photo/antalya-turkey-may-6-2025-600nw-2649166781.jpg" alt="picture of rapids">
                <figcaption>Rapids</figcaption>
            </figure>
            <div></div>
        </section>


        <section class="main-homepage-section-2">
            <img src="https://tragodi.com/wp-content/uploads/2024/01/datanla-waterfall-1.jpg" alt="picture of rapids">
            <form>
                <label for="user-name">Name: </label><input type="text" placeholder="Your name" id="user-name" name="user-name"><br><br>
                <label for="user-email">Email: </label><input type="text" placeholder="Your email" id="user-email" name="user-email"><br><br>
                <label>Message Purpose: </label><br>
                <input type="radio" name="message-purpose" value="general inquiry" id="general-inquiry" checked><label for="general-inquiry">General Inquiry</label><br>
                <input type="radio" name="message-purpose" value="reservation question" id="reservation-question"><label for="reservation-question">Reservation Question</label><br>
                <input type="radio" name="message-purpose" value="website suggestion" id="website-suggestion"><label for="website-suggestion">Website Suggestion</label><br>
                <br>
                <label for="user-message">Message:</label><br>
                <textarea id="user-message" name="user-email" placeholder="Type here"></textarea><br>
                <br>
                <input type="checkbox" value="subscribe" id="subscribe-checkbox" name="user-subscribe" checked>
                <label for="subscribe-checkbox">Please Subscribe me to the monthyly newsletter</label><br>
                <br>
                <button type="submit" value="Submit">Get in Touch!</button>
            </form>
        </section>
    </main>


    <!-------------------------------------------------------FOOTER---------------------------------------------------------->
    <footer>
        <p>© 2026 | White Wolf Rafting | Long Kim Chau</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/whitewolfrafting/">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://www.linkedin.com/in/long-chau-08bb583a4/">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://www.instagram.com/whitewolfrafting/">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
